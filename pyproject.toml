[project]
name = "polyscribe"
version = "0.1.0"
description = "Local AI music transcription and harmonic analysis for Windows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "PolyScribe" }]
dependencies = [
    "jsonschema>=4.23",
    "mido>=1.3",
    "pretty_midi>=0.2.10",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
polyscribe = "polyscribe_cli.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
